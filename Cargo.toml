[workspace]
resolver = "3"
members = [
    "crates/hearth-proto",
    "crates/hearth-crypto",
    "crates/hearth-client-core",
    "crates/hearth-wasm",
    "crates/hearth-server",
    "apps/desktop/src-tauri",
]
# The Tauri shell needs platform webview dev libraries; keep it out of plain `cargo check`.
default-members = [
    "crates/hearth-proto",
    "crates/hearth-crypto",
    "crates/hearth-client-core",
    "crates/hearth-wasm",
    "crates/hearth-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/hearth-chat/hearth"
rust-version = "1.85"

[workspace.dependencies]
hearth-proto = { path = "crates/hearth-proto" }
hearth-crypto = { path = "crates/hearth-crypto" }
hearth-client-core = { path = "crates/hearth-client-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
wasm-bindgen = "0.2"
getrandom = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
