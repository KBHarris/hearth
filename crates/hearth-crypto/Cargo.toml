[package]
name = "hearth-crypto"
description = "Hearth identity keys, device cross-signing, and optional crypto feasibility experiments."
version.workspace = true
edition.workspace = true
license = "Apache-2.0 OR MIT"
rust-version.workspace = true

[features]
# In-memory feasibility experiment, never enabled by the server.
mls-spike = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:getrandom04"]
opaque-spike = ["dep:opaque-ke", "dep:argon2", "dep:sha2", "dep:zeroize"]
auth = ["dep:opaque-ke", "dep:argon2", "dep:sha2", "dep:zeroize"]
local-vault = ["auth", "dep:chacha20poly1305", "dep:hkdf", "dep:serde_json"]
messaging = ["local-vault", "dep:hearth-proto", "dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:getrandom04"]

[dependencies]
ed25519-dalek.workspace = true
rand_core.workspace = true
hex.workspace = true
serde.workspace = true
thiserror.workspace = true
hearth-proto = { workspace = true, optional = true }
openmls = { version = "0.9.0", optional = true }
openmls_rust_crypto = { version = "0.6.0", optional = true }
openmls_basic_credential = { version = "0.6.0", optional = true }
opaque-ke = { version = "4.0.1", optional = true, default-features = false, features = ["ristretto255", "argon2"] }
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9.0", optional = true, features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", optional = true, features = ["wasm_js"] }
