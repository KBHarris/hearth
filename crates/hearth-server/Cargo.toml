[package]
name = "hearth-server"
description = "Hearth home server: REST API, real-time gateway, MLS delivery service, and federation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "hearth-server"

[features]
opaque-spike = ["hearth-crypto/opaque-spike"]

[[bin]]
name = "opaque-spike-server"
path = "src/bin/opaque-spike-server.rs"
required-features = ["opaque-spike"]

[dependencies]
hearth-proto.workspace = true
hearth-crypto = { workspace = true, features = ["messaging"] }
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2 = "0.10"
rand_core.workspace = true
hex.workspace = true
subtle = "2.6"
zeroize = "1"
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
