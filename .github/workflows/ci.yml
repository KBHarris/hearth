name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Hosted budget: checks only, Linux core, or full milestone acceptance'
        type: choice
        required: true
        default: checks
        options: [checks, core, full]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HEARTH_TEST_TARGET_DIR: target

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install workflow validation dependencies
        run: |
          if ! command -v shellcheck >/dev/null 2>&1 || ! python3 -c 'import yaml'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
          fi
      - name: Validate the selected budget tier
        run: node --input-type=module -e "import {suites} from './scripts/verify-ci-results.mjs'; if (!Object.hasOwn(suites, process.env.HEARTH_CI_SUITE)) throw new Error('Choose checks, core or full'); console.log('Selected suite:', process.env.HEARTH_CI_SUITE)"
        env:
          HEARTH_CI_SUITE: ${{ inputs.suite }}
      - name: Validate workflow syntax, expressions and embedded shell
        run: node scripts/verify-workflows.mjs
      - name: Enforce required jobs and workflow security policy
        run: python3 scripts/verify-workflow-policy.py
      - name: Test the required-check gate
        run: node --test scripts/test/verify-ci-results.test.mjs

  rust:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 30
    needs: [workflow-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features hearth-proto/typescript,hearth-crypto/mls-spike,hearth-server/opaque-spike,hearth-wasm/opaque-spike,hearth-wasm/auth -- -D warnings
      - run: cargo test --features hearth-proto/typescript,hearth-crypto/mls-spike,hearth-server/opaque-spike,hearth-wasm/opaque-spike,hearth-wasm/auth
      - run: cargo run -p hearth-proto --features typescript --bin generate-protocol -- --check
      - run: cargo check -p hearth-wasm --target wasm32-unknown-unknown
      - run: cargo check -p hearth-wasm --target wasm32-unknown-unknown --features mls-spike,opaque-spike

  crypto-wasm:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 30
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run spike:tools
      - run: npm run spike:mls:wasm
      - run: npm run spike:opaque:wasm

  auth:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 35
    needs: [rust, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: phase1-fixture-only
          POSTGRES_DB: hearth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hearth -d hearth"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://hearth:phase1-fixture-only@127.0.0.1:5432/hearth
      HEARTH_TEST_DATABASE_URL: postgres://hearth:phase1-fixture-only@127.0.0.1:5432/hearth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run spike:tools
      - run: cargo test -p hearth-server --test auth --test device --test delivery -- --ignored
      - run: node scripts/verify-storage-permissions.mjs
      - run: node scripts/verify-auth.mjs --storage --phase3
        timeout-minutes: 8
        env:
          HEARTH_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || inputs.suite == 'full'
        with:
          name: phase3-auth
          path: target/phase3-evidence/
          if-no-files-found: error
          retention-days: 1

  web:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 20
    needs: [workflow-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run spike:tools
      - run: node scripts/build-auth-wasm.mjs
      - run: npm run verify
        env:
          HEARTH_PREBUILT_WASM: '1'
        timeout-minutes: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.suite == 'full'
        with:
          name: product-auth-wasm
          path: apps/client/src/crypto/generated/
          if-no-files-found: error
          retention-days: 1
      - run: npm run spike:media:build

  desktop:
    if: ${{ inputs.suite == 'full' }}
    timeout-minutes: 90
    needs: [rust, crypto-wasm, auth, web, compose, podman]
    env:
      HEARTH_PREBUILT_WASM: '1'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice gnome-keyring dbus-x11 postgresql
          echo "PGBIN=/usr/lib/postgresql/14/bin" >> "$GITHUB_ENV"
      - name: Windows SQLCipher toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskPerl = 'C:\Strawberry\perl\bin\perl.exe'
          if (!(Test-Path -LiteralPath $taskPerl)) { throw 'Vendored OpenSSL requires complete Strawberry Perl' }
          "PERL=$taskPerl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'OPENSSL_NO_ASM=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: macOS fixture PostgreSQL
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@17
          echo "PGBIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-auth-wasm
          path: apps/client/src/crypto/generated/
      - run: npm run desktop:build -- --debug --no-bundle
      - name: Build packaged identity, DM and community acceptance
        run: npm run build
        env:
          HEARTH_PHASE1_HARNESS: '1'
      - run: cargo build -p hearth-server
      - run: cargo build -p hearth-desktop --features phase1-storage-test,phase1-acceptance
      - name: Fixture shutdown barrier
        run: cargo test -p hearth-desktop --features phase1-storage-test,phase1-acceptance cleanup_preserves_files_until_native_storage_returns
      - name: Windows/macOS native identity vault acceptance
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: node scripts/verify-local-vault.mjs
      - name: Windows/macOS native encrypted message store acceptance
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: node scripts/verify-message-store.mjs
      - name: Windows/macOS packaged client acceptance
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: node scripts/verify-auth.mjs --desktop --native-postgres
      - name: Linux Secret Service, SQLCipher and packaged client acceptance
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run -a dbus-run-session -- bash scripts/verify-linux-key-store.sh
      - name: Full Phase 3 packaged client acceptance
        timeout-minutes: 10
        run: node scripts/verify-auth.mjs --desktop --native-postgres --phase3
        if: runner.os != 'Linux'
      - name: Full Phase 3 packaged Linux acceptance
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash scripts/verify-linux-key-store.sh --phase3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase3-desktop-${{ matrix.os }}
          path: target/phase3-evidence/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase1-desktop-${{ matrix.os }}
          path: target/phase1-evidence/
          if-no-files-found: error
          retention-days: 1
      - name: Windows community and encrypted channel UI acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 25
        run: node scripts/verify-community-ui.mjs --phase3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: phase3-community-ui-windows
          path: target/phase3-evidence/
          if-no-files-found: error
          retention-days: 1
      - run: npm run spike:media:build
      - run: cargo build -p hearth-desktop --features phase0-spike
      - run: node scripts/verify-desktop-mls.mjs
      - if: runner.os != 'macOS'
        run: node scripts/install-livekit-spike.mjs
      - if: runner.os == 'macOS'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false
      - name: Build official macOS SFU fixture
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v1.13.8 https://github.com/livekit/livekit.git "$RUNNER_TEMP/hearth-livekit-source"
          mkdir -p target/livekit-spike
          cd "$RUNNER_TEMP/hearth-livekit-source"
          go build -o "$GITHUB_WORKSPACE/target/livekit-spike/livekit-server" ./cmd/server
      - name: Windows WebView2 acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LIVEKIT_BINARY = Join-Path $PWD 'target/livekit-spike/livekit-server.exe'
          npm run spike:desktop:webview
      - name: macOS WKWebView acceptance
        if: runner.os == 'macOS'
        run: LIVEKIT_BINARY="$PWD/target/livekit-spike/livekit-server" npm run spike:desktop:webview
      - name: Linux WebKitGTK acceptance and capability gate
        if: runner.os == 'Linux'
        run: LIVEKIT_BINARY="$PWD/target/livekit-spike/livekit-server" xvfb-run -a npm run spike:desktop:webview -- --allow-unsupported-media
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase0-webview-${{ matrix.os }}
          path: target/phase0-evidence/
          if-no-files-found: error
          retention-days: 1

  media-browser:
    if: ${{ inputs.suite == 'full' }}
    timeout-minutes: 35
    needs: [rust, crypto-wasm, auth, web, compose, podman]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: safari }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Silent audio backend for headless Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=hearth_spike
          pactl set-default-sink hearth_spike
      - if: runner.os != 'macOS'
        run: node scripts/install-livekit-spike.mjs
      - if: runner.os == 'macOS'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: false
      - name: Prepare official macOS SFU and Safari driver
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v1.13.8 https://github.com/livekit/livekit.git "$RUNNER_TEMP/hearth-livekit-source"
          mkdir -p target/livekit-spike
          cd "$RUNNER_TEMP/hearth-livekit-source"
          go build -o "$GITHUB_WORKSPACE/target/livekit-spike/livekit-server" ./cmd/server
          sudo safaridriver --enable
      - run: LIVEKIT_BINARY="$PWD/target/livekit-spike/livekit-server" HEARTH_TEST_BROWSER=${{ matrix.browser }} npm run spike:media:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase0-browser-${{ matrix.browser }}
          path: target/phase0-evidence/
          if-no-files-found: error
          retention-days: 1

  compose:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 35
    needs: [rust, web, auth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node deploy/setup.mjs
      - run: curl -fsS http://localhost:8080/health
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

  podman:
    if: ${{ inputs.suite == 'core' || inputs.suite == 'full' }}
    timeout-minutes: 40
    needs: [rust, web, auth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - run: systemctl --user start podman.socket
      - run: node deploy/setup.mjs --podman
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/libexec/docker/cli-plugins/docker-compose
          BUILDAH_FORMAT: docker
      - if: always()
        run: podman compose -f deploy/compose.yaml down --volumes
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/libexec/docker/cli-plugins/docker-compose

  required-gate:
    name: Acceptance (${{ inputs.suite }})
    if: ${{ always() && (inputs.suite == 'core' || inputs.suite == 'full') }}
    needs: [workflow-policy, rust, crypto-wasm, auth, web, desktop, media-browser, compose, podman]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Reject failed, cancelled, skipped or missing required jobs
        run: node scripts/verify-ci-results.mjs
        env:
          HEARTH_CI_SUITE: ${{ inputs.suite }}
          HEARTH_CI_NEEDS: ${{ toJSON(needs) }}
