# Hearth self-hosted stack. Works with `docker compose` and `podman compose`.
#
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/compose.yaml up -d --build
#
# Phase 4 adds LiveKit (SFU) and coturn; Phase 6 adds the reverse proxy with automatic TLS.

name: hearth

services:
  server:
    build:
      context: ..
      dockerfile: crates/hearth-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
      HEARTH_S3_ENDPOINT: http://storage:8333
    ports:
      - "${HEARTH_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/hearth
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_DB: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for encrypted attachments. Clients encrypt before upload,
  # so this only ever holds opaque ciphertext. Any S3 provider can replace it.
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - storage-data:/data

volumes:
  server-data:
  postgres-data:
  storage-data:
