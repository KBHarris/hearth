# Hearth self-hosted stack. Works with `docker compose` and `podman compose`.
#
#   node deploy/setup.mjs
#
# Phase 4 adds LiveKit (SFU) and coturn; Phase 6 adds the reverse proxy with automatic TLS.

name: hearth

services:
  server:
    build:
      context: ..
      dockerfile: crates/hearth-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
      HEARTH_S3_ENDPOINT: http://storage:8333
      HEARTH_S3_PUBLIC_ENDPOINT: ${HEARTH_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      HEARTH_S3_ACCESS_KEY: ${HEARTH_S3_ACCESS_KEY:?run node deploy/setup.mjs --init-only}
      HEARTH_S3_SECRET_KEY: ${HEARTH_S3_SECRET_KEY:?run node deploy/setup.mjs --init-only}
      HEARTH_SERVER_NAME: ${HEARTH_SERVER_NAME:-localhost}
      HEARTH_FEDERATION: ${HEARTH_FEDERATION:-false}
      HEARTH_CLIENT_ORIGINS: ${HEARTH_CLIENT_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://tauri.localhost,tauri://localhost}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${HEARTH_HOST:-127.0.0.1}:${HEARTH_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/hearth
    depends_on:
      storage:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_DB: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for encrypted attachments. Clients encrypt before upload,
  # so this only ever holds opaque ciphertext. Any S3 provider can replace it.
  storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/hearth/s3.json -s3.allowedOrigins=${HEARTH_CLIENT_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://tauri.localhost,tauri://localhost} -master.telemetry=false
    ports:
      - "127.0.0.1:${HEARTH_S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
      - ${HEARTH_S3_CONFIG_PATH:-./s3.json}:/etc/hearth/s3.json:ro

volumes:
  server-data:
  postgres-data:
  storage-data:
