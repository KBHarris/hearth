# Optional public HTTPS front end. Requires Docker Compose 2.24.4+.
# Keep the same project name and volumes as compose.yaml.
services:
  server:
    environment:
      HEARTH_SERVER_NAME: ${HEARTH_PUBLIC_ADDRESS:?set HEARTH_PUBLIC_ADDRESS in deploy/.env}
      HEARTH_S3_PUBLIC_ENDPOINT: https://${HEARTH_PUBLIC_ADDRESS}
    # The public interface belongs to Caddy; force the backend to stay on loopback.
    ports: !override
      - "127.0.0.1:${HEARTH_PORT:-8080}:8080"
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    environment:
      HEARTH_SFU_SIGNAL_PORT: ${HEARTH_SFU_SIGNAL_PORT:-7880}
      HEARTH_PUBLIC_ADDRESS: ${HEARTH_PUBLIC_ADDRESS:?set HEARTH_PUBLIC_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
